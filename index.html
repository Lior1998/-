<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יסודות הניהול - מאגר שאלות וכרטיסיות סיכום לבחינה</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #2563eb;
            --secondary: #0d9488;
            --accent: #d97706;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --correct-bg: #dcfce7;
            --correct-border: #16a34a;
            --correct-text: #14532d;
            --wrong-bg: #fee2e2;
            --wrong-border: #dc2626;
            --wrong-text: #7f1d1d;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            color: white;
            padding: 2.2rem 1rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        header h1 {
            font-size: 2.3rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            background: var(--surface);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .tab-btn {
            background: white;
            border: 2px solid var(--primary-light);
            color: var(--primary-light);
            padding: 0.7rem 2.2rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--primary-light);
            color: white;
            box-shadow: 0 2px 6px rgba(37,99,235,0.3);
        }

        main {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* סגנון כרטיסיות סיכום מורחבות */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 1.6rem;
            margin-bottom: 2rem;
        }

        .flashcard {
            background: var(--surface);
            border-radius: 14px;
            padding: 1.6rem;
            box-shadow: var(--shadow);
            border-right: 6px solid var(--primary-light);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .flashcard.accent { border-right-color: var(--accent); }
        .flashcard.secondary { border-right-color: var(--secondary); }

        .flashcard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .flashcard-tag {
            font-size: 0.85rem;
            background: #eff6ff;
            color: var(--primary);
            padding: 0.2rem 0.7rem;
            border-radius: 6px;
            font-weight: bold;
        }

        .flashcard h3 {
            color: var(--primary);
            font-size: 1.3rem;
            margin-bottom: 0.6rem;
        }

        .flashcard-body {
            font-size: 0.96rem;
            margin-bottom: 1.2rem;
            color: #334155;
        }

        .flashcard-body ul {
            padding-right: 1.2rem;
            margin-top: 0.5rem;
        }

        .flashcard-body li {
            margin-bottom: 0.45rem;
        }

        .exam-prep-box {
            background: #fffbeb;
            border: 1px solid #fde68a;
            color: #92400e;
            padding: 0.7rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .visual-diagram-card {
            grid-column: 1 / -1;
            background: var(--surface);
            border-radius: 14px;
            padding: 1.8rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.8rem;
            border-top: 5px solid var(--primary);
        }

        /* סגנון מבחן ותרגול */
        .exam-bar {
            background: var(--surface);
            padding: 1.2rem 1.6rem;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            margin-bottom: 1.8rem;
            gap: 1rem;
        }

        .filters {
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }

        select, .btn-action {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            outline: none;
        }

        .btn-action {
            background-color: var(--primary-light);
            color: white;
            cursor: pointer;
            border: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-action:hover {
            background-color: var(--primary);
        }

        .score-pill {
            background: #f1f5f9;
            padding: 0.5rem 1.2rem;
            border-radius: 9999px;
            font-weight: bold;
            color: var(--primary);
            font-size: 1.15rem;
        }

        .q-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 1.8rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .q-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
        }

        .q-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            color: var(--text);
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .opt-btn {
            text-align: right;
            padding: 0.85rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #f8fafc;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .opt-btn:hover:not(.locked) {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        .opt-btn.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: bold;
        }

        .opt-btn.wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .feedback-panel {
            display: none;
            margin-top: 1.2rem;
            padding: 1.2rem;
            border-radius: 8px;
            background: #f8fafc;
            border-right: 5px solid var(--primary-light);
        }

        .feedback-panel.correct { border-right-color: var(--correct-border); }
        .feedback-panel.wrong { border-right-color: var(--wrong-border); }

        .understanding-q {
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px dashed #cbd5e1;
            color: #0369a1;
            font-size: 0.92rem;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            margin: 2.2rem 0;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 0.5rem 0.9rem;
            border: 1px solid var(--border);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .page-btn.active {
            background: var(--primary-light);
            color: white;
            font-weight: bold;
            border-color: var(--primary-light);
        }
    </style>
</head>
<body>

<header>
    <h1>יסודות הניהול – פורטל הסיכומים ומאגר הבחינה</h1>
    <p>כרטיסיות סיכום מעמיקות (1.2 עד 5.7) ומאגר 100 שאלות מלא עם מחוון בדיקה אקדמי</p>
</header>
